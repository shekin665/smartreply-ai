# Test-only dummy OAuth2 client registration. The real app requires a real
# GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET to even start (there is no demo login
# fallback), but constructing Spring Security's ClientRegistration bean is a
# purely local, in-memory operation - no network call happens just from the
# Spring context loading, so these placeholder values are safe for tests and
# never need to be (and never are) real credentials.
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
