LEAD_INVITATION_FORMAL=பின்வரும் நிகழ்வுக்கு உங்களை அன்புடன் அழைக்கிறோம்:
LEAD_INVITATION_FRIENDLY=இந்த நிகழ்வில் உங்களைச் சந்திக்க ஆவலாக இருக்கிறோம்:
LEAD_REMINDER_FORMAL=பின்வரும் நிகழ்வு குறித்த ஒரு மென்மையான நினைவூட்டல்:
LEAD_REMINDER_FRIENDLY=இந்த நிகழ்வு பற்றிய ஒரு சிறிய நினைவூட்டல்:
LEAD_MEETING_REQUEST_FORMAL=பின்வரும் விவரங்களுடன் ஒரு சந்திப்பைக் கோருகிறேன்:
LEAD_MEETING_REQUEST_FRIENDLY=நாம் சந்திக்கலாமா? விவரங்கள் இதோ:
ASK_CONFIRM_FORMAL=தங்கள் வருகையை உறுதிப்படுத்துமாறு கேட்டுக்கொள்கிறேன்.
ASK_CONFIRM_FRIENDLY=நீங்கள் வர முடியுமா என்று தெரிவியுங்கள்!
DETAILED_EXTRA=மேலும் விவரங்கள் தேவைப்பட்டால் தயவுசெய்து என்னைத் தொடர்பு கொள்ளுங்கள்.

REPLY_OPEN_FORMAL="{0}" தொடர்பான உங்கள் மின்னஞ்சலுக்கு நன்றி.
REPLY_OPEN_FRIENDLY="{0}" பற்றி எழுதியதற்கு நன்றி!
REPLY_OPEN_CONCISE=புரிந்தது, உடனே பார்க்கிறேன்.
REPLY_OPEN_APOLOGETIC="{0}" தொடர்பாக பதில் அளிக்க தாமதமானதற்கு வருந்துகிறேன்.
REPLY_ACTIONS=பின்வருவனவற்றை நான் கவனித்துக்கொள்கிறேன்: {0}.
REPLY_DEADLINE=காலக்கெடு: {0}. அதற்குள் இதை முடித்துவிடுவேன்.
REPLY_END_FORMAL=மேலும் ஏதேனும் தேவைப்பட்டால் தெரிவிக்கவும்.
REPLY_END_FRIENDLY=வேறு ஏதாவது இருந்தால் சொல்லுங்கள்!
REPLY_END_CONCISE=விரைவில் தொடர்பு கொள்கிறேன்.
REPLY_END_APOLOGETIC=உங்கள் பொறுமைக்கு நன்றி.
REPLY_DETAILED_EXTRA=உங்கள் செய்தியை கவனமாகப் படித்தேன்; முன்னேற்றம் குறித்து தொடர்ந்து தெரிவிப்பேன்.
