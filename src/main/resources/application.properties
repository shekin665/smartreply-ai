spring.application.name=SmartReply AI

# Render (and most PaaS hosts) assign the port dynamically via the PORT env var -
# fall back to 8080 for local development where PORT isn't set.
server.port=${PORT:8080}

# Thymeleaf: disable caching so template edits show up without a restart during the demo
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# No database is used. Demo/seeded data lives in memory inside EmailService and is
# re-seeded on every application restart (or via POST /api/demo/reset). Real mail
# comes live from the Gmail REST API using each signed-in user's own OAuth2 token -
# nothing Gmail-related is stored on disk.
logging.level.com.smartreply.ai=INFO

# ---- Google Sign-In / Gmail API (REQUIRED to run the app) --------------------
# Every user authenticates with their real Google account - there is no demo
# login. This needs a Google Cloud project with the Gmail API enabled and an
# OAuth 2.0 Client ID. See README.md section "Google Cloud Console setup" for
# exact click-by-click steps.
#
# Set these as ENVIRONMENT VARIABLES before starting the app - never hardcode
# them here or commit them:
#   GOOGLE_CLIENT_ID=xxxxxxxxxx.apps.googleusercontent.com
#   GOOGLE_CLIENT_SECRET=xxxxxxxxxx
#
# Authorized redirect URI to register in Google Cloud Console (must match exactly) -
# add BOTH if you run locally and deploy, Google allows multiple:
#   http://localhost:8080/login/oauth2/code/google
#   https://<your-render-app-name>.onrender.com/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile,https://www.googleapis.com/auth/gmail.readonly,https://www.googleapis.com/auth/gmail.send

# ---- Running behind Render's HTTPS proxy -------------------------------------
# Render terminates TLS and forwards plain HTTP to the app, adding X-Forwarded-* headers.
# Without this, Spring builds the Google OAuth2 callback as http://<host>/login/oauth2/code/google,
# which does not match the https:// redirect URI registered in Google Cloud Console
# (error: redirect_uri_mismatch), so "Sign in with Google" - and therefore reading and
# sending real Gmail - fails on the deployed site. `framework` makes Spring honour the
# forwarded scheme/host. Harmless when running locally on http://localhost:8080.
server.forward-headers-strategy=framework

# ---- AI text assistant (optional) --------------------------------------------
# Turns on "Improve / translate my text" in Compose and Reply. Set ANTHROPIC_API_KEY as an
# environment variable (never commit it). Without it the rest of the app works as before.
smartreply.ai.api-key=${ANTHROPIC_API_KEY:}
smartreply.ai.model=${SMARTREPLY_AI_MODEL:claude-haiku-5-5}
